[package]
name = "auth-rust-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
resend-rs = "0.25.1"
serde = "1.0.228"
sqlx = { version = "0.8.6", features = ["postgres", "macros", "uuid", "chrono", "runtime-tokio-rustls"] }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
